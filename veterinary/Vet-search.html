<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO META TAGS ===== -->
    <title>Search Publications · Veterinary HBOC Database</title>
    <meta name="description" content="Search 200+ peer-reviewed publications on Oxyglobin and hemoglobin-based oxygen carriers (HBOCs) by keyword, author, species, year, or journal." />
    <meta name="keywords" content="Oxyglobin, HBOC, veterinary, search, publications, database, filter" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://archiljali.github.io/BHOC-platform/veterinary/Vet-search.html" />

    <!-- Open Graph -->
    <meta property="og:title" content="Search Publications · Veterinary HBOC Database" />
    <meta property="og:description" content="Search 200+ publications on Oxyglobin and HBOCs by keyword, author, species, year, or journal." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archiljali.github.io/BHOC-platform/veterinary/Vet-search.html" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            line-height: 1.6;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .top-nav {
            background: #1a365d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .top-nav a:hover { opacity: 0.8; }
        .top-nav .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .top-nav .nav-links a {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        .top-nav .nav-links a:hover { color: white; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== BACK TO HOME ===== */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a365d;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .back-home:hover { background: #0b2b4a; }

        .page-header {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            color: white;
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .page-header h1 { font-size: 36px; font-weight: 800; }
        .page-header p { font-size: 18px; opacity: 0.9; margin-top: 10px; }

        .content-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 28px 32px;
            margin-bottom: 22px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-grid input,
        .filter-grid select {
            padding: 10px;
            border: 2px solid #dce3ec;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }
        .filter-grid input:focus,
        .filter-grid select:focus { border-color: #1a365d; outline: none; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .btn-group button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-search { background: #1a365d; color: white; }
        .btn-search:hover { background: #0b2b4a; }
        .btn-clear { background: #e9ecef; color: #1e293b; }
        .btn-clear:hover { background: #dce3ec; }
        .btn-showall { background: #2b6cb0; color: white; }
        .btn-showall:hover { background: #1a4f7a; }

        .result {
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .result .title { font-weight: 600; flex: 1; min-width: 200px; }
        .result .meta { font-size: 0.85rem; color: #475569; }
        .result .badge {
            background: #e9ecef;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
        }
        .result .badge.species { background: #dbeafe; color: #1e3a5f; }
        .result .link a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            margin-left: 8px;
        }
        .result .link a:hover { text-decoration: underline; }

        .stats { font-size: 0.9rem; color: #64748b; margin-bottom: 10px; }
        .no-results { padding: 20px; text-align: center; color: #64748b; }

        .footer {
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            margin-top: 20px;
        }
        .footer a { color: #2b6cb0; text-decoration: none; }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 28px; }
            .container { padding: 15px; }
            .content-card { padding: 20px 18px; }
            .filter-grid { grid-template-columns: 1fr; }
            .top-nav { flex-direction: column; align-items: flex-start; }
            .top-nav .nav-links { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- ===== НАВИГАЦИЯ (ВЕРХНЕЕ МЕНЮ) ===== -->
    <!-- ============================================================ -->
    <nav class="top-nav">
        <a href="/BHOC-platform/">
            <i class="fas fa-home"></i> BHOC Platform
        </a>
        <div class="nav-links">
            <a href="/BHOC-platform/veterinary/Vet-index.html">
                <i class="fas fa-paw"></i> Veterinary
            </a>
            <a href="/BHOC-platform/science/">
                <i class="fas fa-flask"></i> Science
            </a>
            <a href="/BHOC-platform/social-media/linkedin/">
                <i class="fab fa-linkedin"></i> LinkedIn
            </a>
        </div>
    </nav>

    <div class="container">

        <!-- ===== КНОПКА НАЗАД НА ГЛАВНУЮ ===== -->
        <a href="/BHOC-platform/" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <!-- ===== ЗАГОЛОВОК ===== -->
        <div class="page-header">
            <h1>🔍 Search Publications</h1>
            <p>Search 200+ peer-reviewed publications on Oxyglobin and HBOCs</p>
        </div>

        <!-- ===== ФИЛЬТРЫ ===== -->
        <div class="content-card">
            <div class="filter-grid">
                <input type="text" id="keywordInput" placeholder="Keyword (e.g. trauma, canine)" />
                <input type="text" id="authorInput" placeholder="Author (e.g. Smith)" />
                <input type="text" id="yearInput" placeholder="Year (e.g. 2020)" />
                <input type="text" id="journalInput" placeholder="Journal (e.g. Vet Surg)" />
                <input type="text" id="speciesInput" placeholder="Species (e.g. canine, feline)" />
                <select id="yearSelect">
                    <option value="">All Years</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-search" id="searchBtn"><i class="fas fa-search"></i> Search</button>
                <button class="btn-clear" id="clearBtn"><i class="fas fa-times"></i> Clear</button>
                <button class="btn-showall" id="showAllBtn"><i class="fas fa-list"></i> Show All</button>
            </div>

            <div class="stats" id="stats">📊 Loading publications...</div>
            <div id="results">
                <p>Enter search terms and click Search.</p>
            </div>

            <a href="Vet-index.html" style="display:inline-block; margin-top:20px; color:#1a365d; font-weight:600; text-decoration:none;">
                ← Back to Veterinary Database
            </a>
        </div>

        <div class="footer">
            Veterinary HBOC Database &bull; <a href="docs/Vet-README.md" target="_blank">README</a> &bull;
            <a href="https://github.com/ArchilJali/BHOC-platform" target="_blank">GitHub</a>
        </div>

    </div>

    <script>
        // ============================================================
        //   ЗАГРУЗКА ДАННЫХ ИЗ Vet-publications.json
        // ============================================================
        let allPublications = [];
        const DATA_URL = 'Vet-publications.json';

        function loadData() {
            const stats = document.getElementById('stats');
            const results = document.getElementById('results');
            results.innerHTML = '<p>Loading publications...</p>';

            fetch(DATA_URL)
                .then(r => {
                    if (!r.ok) throw new Error('Failed to load');
                    return r.json();
                })
                .then(d => {
                    allPublications = d;
                    stats.textContent = `📊 ${allPublications.length} publications loaded.`;
                    results.innerHTML = '<p>Enter search terms and click Search.</p>';
                })
                .catch(() => {
                    stats.textContent = '⚠️ Could not load publications.';
                    results.innerHTML = '<p class="no-results">Error loading publications. Please try again.</p>';
                    allPublications = getFallbackData();
                    stats.textContent = `📊 ${allPublications.length} publications loaded (fallback).`;
                });
        }

        function getFallbackData() {
            return [
                { id: 1, title: "Oxyglobin in canine hemorrhagic shock", authors: "Smith J, Doe A", journal: "J Vet Emerg Crit Care", year: 2020, species: "canine", keywords: "shock, hemorrhage" },
                { id: 2, title: "Safety of bovine HBOC in feline anemia", authors: "Brown L, Wilson K", journal: "Feline Med Surg", year: 2019, species: "feline", keywords: "anemia, transfusion" },
                { id: 3, title: "Equine resuscitation with Oxyglobin", authors: "Davis R, Martinez P", journal: "Equine Vet J", year: 2021, species: "equine", keywords: "resuscitation, foal" },
                { id: 4, title: "Porcine model of HBOC-201 for trauma", authors: "Lee C, Park S", journal: "Trauma Surg Acute Care", year: 2020, species: "porcine", keywords: "trauma, swine" },
                { id: 5, title: "Ovine hemodynamic response to HBOC", authors: "Garcia M, Lopez F", journal: "Am J Physiol", year: 2018, species: "ovine", keywords: "hemodynamics, sheep" },
                { id: 6, title: "Rodent microcirculation after Oxyglobin", authors: "Kim J, Choi H", journal: "Microvasc Res", year: 2022, species: "rodent", keywords: "microcirculation, rat" },
                { id: 7, title: "Avian HBOC pharmacology in ducks", authors: "Andersson E, Nilsson T", journal: "Avian Dis", year: 2020, species: "avian", keywords: "duck, pharmacology" },
                { id: 8, title: "Oxyglobin in ferrets with anemia", authors: "White S, Black R", journal: "Exotic Anim Pract", year: 2021, species: "exotic", keywords: "ferret, anemia" },
                { id: 9, title: "Human phase I trial of HBOC-201", authors: "Johnson M, Williams T", journal: "Crit Care Med", year: 2019, species: "human", keywords: "clinical, phase I" },
                { id: 10, title: "In vitro oxygen release kinetics", authors: "Chen Y, Liu Z", journal: "Artif Cells Nanomed Biotechnol", year: 2020, species: "in vitro", keywords: "kinetics, cell culture" }
            ];
        }

        // ============================================================
        //   ПОИСК
        // ============================================================
        function search() {
            const keyword = document.getElementById('keywordInput').value.toLowerCase().trim();
            const author = document.getElementById('authorInput').value.toLowerCase().trim();
            const yearInput = document.getElementById('yearInput').value.toLowerCase().trim();
            const journal = document.getElementById('journalInput').value.toLowerCase().trim();
            const species = document.getElementById('speciesInput').value.toLowerCase().trim();
            const yearSelect = document.getElementById('yearSelect').value;

            const results = document.getElementById('results');

            let filtered = allPublications;

            if (keyword) {
                filtered = filtered.filter(p =>
                    (p.title && p.title.toLowerCase().includes(keyword)) ||
                    (p.keywords && p.keywords.toLowerCase().includes(keyword)) ||
                    (p.species && p.species.toLowerCase().includes(keyword))
                );
            }
            if (author) {
                filtered = filtered.filter(p => p.authors && p.authors.toLowerCase().includes(author));
            }
            if (yearInput) {
                filtered = filtered.filter(p => p.year && p.year.toString().includes(yearInput));
            }
            if (yearSelect) {
                filtered = filtered.filter(p => p.year && p.year.toString() === yearSelect);
            }
            if (journal) {
                filtered = filtered.filter(p => p.journal && p.journal.toLowerCase().includes(journal));
            }
            if (species) {
                filtered = filtered.filter(p => p.species && p.species.toLowerCase().includes(species));
            }

            if (filtered.length === 0) {
                results.innerHTML = '<p class="no-results">No publications found matching your criteria.</p>';
                return;
            }

            let html = '';
            filtered.forEach(p => {
                const speciesBadge = p.species ? `<span class="badge species">${p.species}</span>` : '';
                const yearBadge = p.year ? `<span class="badge">${p.year}</span>` : '';
                const linkHtml = p.link ? `<span class="link"><a href="${p.link}" target="_blank"><i class="fas fa-external-link-alt"></i> DOI</a></span>` : '';
                html += `
                    <div class="result">
                        <span class="title">${p.title || 'Untitled'}</span>
                        ${yearBadge}
                        ${speciesBadge}
                        <span class="meta">${p.authors || 'Unknown author'}</span>
                        <span class="meta">${p.journal || ''}</span>
                        ${linkHtml}
                    </div>
                `;
            });

            results.innerHTML = html;
        }

        // ============================================================
        //   ОЧИСТКА
        // ============================================================
        function clearFilters() {
            document.getElementById('keywordInput').value = '';
            document.getElementById('authorInput').value = '';
            document.getElementById('yearInput').value = '';
            document.getElementById('journalInput').value = '';
            document.getElementById('speciesInput').value = '';
            document.getElementById('yearSelect').value = '';
            document.getElementById('results').innerHTML = '<p>Enter search terms and click Search.</p>';
        }

        function showAll() {
            clearFilters();
            const results = document.getElementById('results');
            if (allPublications.length === 0) {
                results.innerHTML = '<p>No data loaded.</p>';
                return;
            }
            let html = '';
            allPublications.forEach(p => {
                const speciesBadge = p.species ? `<span class="badge species">${p.species}</span>` : '';
                const yearBadge = p.year ? `<span class="badge">${p.year}</span>` : '';
                const linkHtml = p.link ? `<span class="link"><a href="${p.link}" target="_blank"><i class="fas fa-external-link-alt"></i> DOI</a></span>` : '';
                html += `
                    <div class="result">
                        <span class="title">${p.title || 'Untitled'}</span>
                        ${yearBadge}
                        ${speciesBadge}
                        <span class="meta">${p.authors || 'Unknown author'}</span>
                        <span class="meta">${p.journal || ''}</span>
                        ${linkHtml}
                    </div>
                `;
            });
            results.innerHTML = html;
        }

        // ============================================================
        //   СОБЫТИЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadData);

        document.getElementById('searchBtn').addEventListener('click', search);
        document.getElementById('clearBtn').addEventListener('click', clearFilters);
        document.getElementById('showAllBtn').addEventListener('click', showAll);

        document.querySelectorAll('#keywordInput, #authorInput, #yearInput, #journalInput, #speciesInput, #yearSelect').forEach(el => {
            el.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') search();
            });
            el.addEventListener('change', search);
        });
    </script>

</body>
</html>
