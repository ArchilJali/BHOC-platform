<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">BHOC global modular robotic manufacturing and oxygen security concept</title><desc id="d">Editorial concept showing a connected world with regional modular manufacturing nodes, centralized digital oversight, AI-assisted monitoring, QA and QC for resilient Precision Oxygen Therapeutics supply.</desc><defs><radialGradient id="bg"><stop stop-color="#0b5c83"/><stop offset="1" stop-color="#031d35"/></radialGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="54" y="62" fill="white" font-family="Arial" font-size="36" font-weight="800">BHOC</text><text x="54" y="88" fill="#8fe9ff" font-family="Arial" font-size="14">PRECISION OXYGEN THERAPEUTICS</text><text x="600" y="80" text-anchor="middle" fill="white" font-family="Arial" font-size="38" font-weight="700">Global Access to Precision Oxygen Therapeutics</text><text x="600" y="116" text-anchor="middle" fill="#8fe9ff" font-family="Arial" font-size="22">Modular · Robotic · Scalable · Regional</text><ellipse cx="600" cy="330" rx="440" ry="190" fill="#073b61" stroke="#38c9ff" stroke-width="3"/><g stroke="#4edbff" stroke-width="2" opacity=".7"><path d="M260 270Q600 80 940 270"/><path d="M310 390Q600 170 890 390"/><path d="M390 220Q600 500 810 220"/><path d="M210 330Q600 520 990 330"/></g><g fill="#fff" stroke="#63e7ff" stroke-width="5"><circle cx="290" cy="275" r="18"/><circle cx="470" cy="205" r="18"/><circle cx="665" cy="305" r="18"/><circle cx="870" cy="245" r="18"/><circle cx="400" cy="410" r="18"/><circle cx="900" cy="410" r="18"/></g><g fill="#bdf5ff" font-family="Arial" font-size="15" font-weight="700"><text x="245" y="245">REGIONAL NODE</text><text x="425" y="175">MODULAR PRODUCTION</text><text x="620" y="275">LOCAL CAPACITY</text><text x="825" y="215">ROBOTIC SYSTEM</text><text x="350" y="450">SCALABLE DEPLOYMENT</text><text x="850" y="450">RESILIENT SUPPLY</text></g><rect x="330" y="490" width="540" height="82" rx="16" fill="#02182b" stroke="#36d7ff"/><text x="600" y="522" text-anchor="middle" fill="#7ce8ff" font-family="Arial" font-size="20" font-weight="700">CENTRAL DIGITAL OVERSIGHT</text><text x="600" y="551" text-anchor="middle" fill="white" font-family="Arial" font-size="16">AI-assisted monitoring · QA/QC · Supply visibility · Readiness</text><text x="54" y="590" fill="white" font-family="Arial" font-size="17">Development objective · Requires engineering, validation, regulatory qualification and implementation</text><text x="1140" y="590" text-anchor="end" fill="#7ce8ff" font-family="Arial" font-size="16">OXYGEN SECURITY</text></svg>