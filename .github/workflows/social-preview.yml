name: Generate social preview

on:
  push:
    branches:
      - main
      - 'preview/evidence-custom-domain-20260912'
    paths:
      - 'assets/evidence.css'
      - 'scripts/generate_social_preview.py'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-social-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate 1200x630 Open Graph image from site colours
        run: python scripts/generate_social_preview.py
      - name: Commit preview if changed
        run: |
          git config user.name "BHOC Social Preview Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/bhoc-evidence-social-preview.png
          if git diff --cached --quiet; then
            echo "Social preview already current."
            exit 0
          fi
          git commit -m "Regenerate BHOC social preview"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
