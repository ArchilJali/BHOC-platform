name: Generate compact social preview

on:
  push:
    branches:
      - main
      - 'preview/evidence-custom-domain-20260912'
    paths:
      - 'assets/evidence.css'
      - 'scripts/preview_compact_config.json'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-social-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate compact OG thumbnail from site colours
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          cfg = json.loads((root/'scripts/preview_compact_config.json').read_text())
          css = (root/'assets/evidence.css').read_text()
          block = re.search(r'body\.theme-main\{([^}]*)\}', css).group(1)
          vals = dict(re.findall(r'(--[\w-]+):\s*(#[0-9a-fA-F]{6})', block))
          def rgb(name, fallback):
              v = vals.get(name, fallback).lstrip('#')
              return tuple(int(v[i:i+2],16) for i in (0,2,4))

          ink = rgb('--ink','#102f49')
          teal = rgb('--teal','#087a76')
          line = rgb('--line','#d8e3e8')
          wash = rgb('--wash','#f2f6f7')
          w,h = cfg['width'], cfg['height']
          img = Image.new('RGB',(w,h),wash)
          d = ImageDraw.Draw(img)
          fonts = Path('/usr/share/fonts/truetype/dejavu')
          f1 = ImageFont.truetype(str(fonts/'DejaVuSans-Bold.ttf'),52)
          f2 = ImageFont.truetype(str(fonts/'DejaVuSans-Bold.ttf'),20)
          d.rounded_rectangle((8,8,w-8,h-8),radius=26,fill='white',outline=line,width=2)
          d.rectangle((8,8,w-8,18),fill=teal)
          text='BHOC'
          b=d.textbbox((0,0),text,font=f1)
          d.text(((w-(b[2]-b[0]))/2,65),text,font=f1,fill=ink)
          d.line((54,133,w-54,133),fill=teal,width=4)
          label=cfg['label']
          b=d.textbbox((0,0),label,font=f2)
          d.text(((w-(b[2]-b[0]))/2,157),label,font=f2,fill=teal)
          img.save(root/'assets/bhoc-evidence-social-preview.png','PNG',optimize=True)
          PY
      - name: Commit preview if changed
        run: |
          git config user.name "BHOC Social Preview Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/bhoc-evidence-social-preview.png
          if git diff --cached --quiet; then
            echo "Social preview already current."
            exit 0
          fi
          git commit -m "Regenerate compact BHOC social preview"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
