name: Validate evidence hub
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search, evidence and SEO regression tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check assets/publications.js
          node --check assets/publications-core.js
          node --check assets/evidence-search.js
          node --check scripts/enrich_directional_metadata.cjs
          node --check scripts/build_platform_overview.cjs
          node --check scripts/apply_seo_metadata.cjs
      - name: SEO metadata and sitemap are current
        run: node scripts/apply_seo_metadata.cjs --check
      - name: Internal pages and anchors
        run: python3 scripts/check_links.py
      - name: Veterinary overview agrees with the bibliography
        run: node scripts/build_veterinary_overview.cjs --check

      - name: Platform overview agrees with all evidence hubs
        run: node scripts/build_platform_overview.cjs --check

      - name: Source coverage and provenance pages agree with the bibliography
        run: node scripts/build_source_pages.cjs --check
