name: Validate evidence hub
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Search, evidence and SEO regression tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check assets/publications.js
          node --check assets/publications-core.js
          node --check assets/evidence-search.js
          node --check scripts/enrich_directional_metadata.cjs
          node --check scripts/build_platform_overview.cjs
          node --check scripts/apply_seo_metadata.cjs
      - name: SEO metadata and sitemap are current
        run: node scripts/apply_seo_metadata.cjs --check
      - name: Internal pages and anchors
        run: python3 scripts/check_links.py
      - name: Veterinary overview agrees with the bibliography
        run: |
          if node scripts/build_veterinary_overview.cjs --check; then
            exit 0
          fi
          cp veterinary/Vet-index.html /tmp/Vet-index.before.html
          node scripts/build_veterinary_overview.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const normalize=s=>s
            .replace(/&#39;|&apos;/g,"'")
            .replace(/\s+/g,' ')
            .trim();
          const before=normalize(fs.readFileSync('/tmp/Vet-index.before.html','utf8'));
          const after=normalize(fs.readFileSync('veterinary/Vet-index.html','utf8'));
          if(before!==after){
            let i=0;
            while(i<before.length&&i<after.length&&before[i]===after[i])i++;
            const start=Math.max(0,i-220), end=i+320;
            console.error('Vet-index.html differs from generated overview beyond whitespace/apostrophe encoding.');
            console.error('First normalized difference at character '+i);
            console.error('CHECKED-IN: '+before.slice(start,end));
            console.error('GENERATED : '+after.slice(start,end));
            process.exit(1);
          }
          NODE
          git diff --exit-code -- veterinary/README.md veterinary/Vet-README.md veterinary/Vet-README.html veterinary/overview-statistics.json
          git checkout -- veterinary/Vet-index.html veterinary/README.md veterinary/Vet-README.md veterinary/Vet-README.html veterinary/overview-statistics.json

      - name: Platform overview agrees with all evidence hubs
        run: node scripts/build_platform_overview.cjs --check

      - name: Source coverage and provenance pages agree with the bibliography
        run: node scripts/build_source_pages.cjs --check
