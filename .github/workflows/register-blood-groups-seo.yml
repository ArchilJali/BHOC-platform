name: Register Blood Groups SEO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/register_blood_groups_seo.cjs'
      - '.github/workflows/register-blood-groups-seo.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Register page and regenerate managed SEO
        run: |
          node scripts/register_blood_groups_seo.cjs
          node scripts/apply_seo_metadata.cjs
      - name: Commit SEO registration
        shell: bash
        run: |
          git config user.name "BHOC Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add seo/page-metadata.json sitemap.xml real-world-evidence/blood-groups-history/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register Blood Groups page in canonical SEO map"
          git pull --rebase origin main
          git push
