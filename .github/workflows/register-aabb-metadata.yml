name: Register AABB page in canonical SEO map
on:
  push:
    branches: [main]
    paths:
      - 'scripts/register_aabb_metadata.py'
      - '.github/workflows/register-aabb-metadata.yml'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Register AABB page metadata
        run: python scripts/register_aabb_metadata.py
      - name: Regenerate managed SEO output
        run: node scripts/apply_seo_metadata.cjs
      - name: Validate SEO tests
        run: node --test tests/seo.test.cjs
      - name: Commit canonical SEO registration
        run: |
          git config user.name "BHOC SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add seo/page-metadata.json sitemap.xml science/aabb-rbc-transfusion-thresholds-oxygen-delivery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register AABB evidence page in canonical SEO map"
          git pull --rebase --autostash origin main
          git push origin main
