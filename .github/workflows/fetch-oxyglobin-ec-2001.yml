name: Fetch approved Oxyglobin EC 2001 PDF

on:
  push:
    branches:
      - update/oxyglobin-ec-2001-live

permissions:
  contents: write

jobs:
  archive-official-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/oxyglobin-ec-2001-live
          fetch-depth: 0
      - name: Fetch official European Commission PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p veterinary/regulatory/oxyglobin
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://ec.europa.eu/health/documents/community-register/2001/200112184765/anx_4765_en.pdf' \
            -o veterinary/regulatory/oxyglobin/Oxyglobin-EC-Annexes-2001.pdf
          test -s veterinary/regulatory/oxyglobin/Oxyglobin-EC-Annexes-2001.pdf
          head -c 5 veterinary/regulatory/oxyglobin/Oxyglobin-EC-Annexes-2001.pdf | grep -q '%PDF-'
          python - <<'PY'
          from pathlib import Path
          p=Path('veterinary/regulatory/oxyglobin/Oxyglobin-EC-Annexes-2001.pdf')
          print('PDF bytes:', p.stat().st_size)
          assert p.stat().st_size > 10000
          PY
      - name: Commit archived primary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BHOC Platform Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add veterinary/regulatory/oxyglobin/Oxyglobin-EC-Annexes-2001.pdf
          if git diff --cached --quiet; then
            echo 'PDF already archived; no commit needed.'
            exit 0
          fi
          git commit -m 'Archive official Oxyglobin EC Annexes 2001 PDF'
          git push origin HEAD:update/oxyglobin-ec-2001-live
