name: Platform version stamp

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - '*.htm'
      - '**/*.htm'
      - '*.md'
      - '**/*.md'
      - 'assets/**'
      - 'config/**'
      - 'version.json'
      - '.github/workflows/version-stamp.yml'
      - '!drafts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message || '', '[version-stamp]') }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tbilisi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Update live platform status
        shell: bash
        run: |
          git pull --rebase origin main
          SOURCE_COMMIT="$(git log -1 --format=%H --invert-grep --fixed-strings --grep='[version-stamp]')"
          VERSION="$(TZ=Asia/Tbilisi date +'%y.%m.%d')"
          UPDATED="$(TZ=Asia/Tbilisi date +'%d %b %Y')"
          ISO="$(TZ=Asia/Tbilisi date +'%Y-%m-%d')"
          python3 - "$VERSION" "$UPDATED" "$ISO" "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import json, re, sys

          version, updated, iso, source_commit = sys.argv[1:]
          if not source_commit:
              raise SystemExit("Missing source commit")
          version_file = Path('version.json')

          if version_file.exists():
              try:
                  current = json.loads(version_file.read_text(encoding='utf-8'))
              except Exception:
                  current = {}
          else:
              current = {}

          if current.get('source_commit') == source_commit:
              print('This content commit is already stamped.')
              raise SystemExit(0)

          first_published = current.get('first_published', '20 Aug 2026')
          first_published_iso = current.get('first_published_iso', '2026-08-20')
          updates = int(current.get('updates', 14)) + 1

          version_file.write_text(json.dumps({
              'version': version,
              'first_published': first_published,
              'first_published_iso': first_published_iso,
              'updates': updates,
              'updated': updated,
              'updated_iso': iso,
              'timezone': 'Asia/Tbilisi',
              'source_commit': source_commit
          }, indent=2) + '\n', encoding='utf-8')

          label = (
              f'First published {first_published} · {updates} updates · '
              f'Last updated {updated} · Version {version}'
          )

          # Keep existing footer children, including social icons, while replacing
          # only the leading status text. Do not inject a footer into draft pages.
          pattern = re.compile(
              r'(<p\b[^>]*\bclass\s*=\s*["\'][^"\']*\bplatform-version\b[^"\']*["\'][^>]*>)(.*?)(</p>)',
              flags=re.I | re.S
          )

          def replace_status(match):
              old_body = match.group(2)
              child_start = old_body.find('<')
              children = old_body[child_start:] if child_start >= 0 else ''
              return match.group(1) + label + children + match.group(3)

          verification_file = 'google3023721c92b6366f.html'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'drafts' in p.parts or p.name == verification_file:
                  continue
              content = p.read_text(encoding='utf-8')
              revised = pattern.sub(replace_status, content, count=1)
              if p.as_posix() == 'index.html':
                  revised = re.sub(
                      r'(<span class="tag">Updated )[^<]*(</span>)',
                      lambda m: m.group(1) + updated + m.group(2),
                      revised, count=1
                  )
              if revised != content:
                  p.write_text(revised, encoding='utf-8')
          PY

      - name: Commit live status
        shell: bash
        run: |
          git config user.name "BHOC Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          VERSION="$(TZ=Asia/Tbilisi date +'%y.%m.%d')"
          git commit -m "Update live platform status to ${VERSION} [version-stamp]"
          git pull --rebase origin main
          git push
