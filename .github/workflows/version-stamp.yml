name: Platform version stamp

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-version-stamp
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message || '', '[version-stamp]') }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tbilisi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update live platform status
        shell: bash
        run: |
          git pull --rebase origin main
          VERSION="$(TZ=Asia/Tbilisi date +'%y.%m.%d')"
          UPDATED="$(TZ=Asia/Tbilisi date +'%d %b %Y')"
          ISO="$(TZ=Asia/Tbilisi date +'%Y-%m-%d')"
          python3 - "$VERSION" "$UPDATED" "$ISO" <<'PY'
          from pathlib import Path
          import json, re, sys

          version, updated, iso = sys.argv[1:]
          version_file = Path('version.json')

          if version_file.exists():
              try:
                  current = json.loads(version_file.read_text(encoding='utf-8'))
              except Exception:
                  current = {}
          else:
              current = {}

          first_published = current.get('first_published', '20 Aug 2026')
          first_published_iso = current.get('first_published_iso', '2026-08-20')
          updates = int(current.get('updates', 14)) + 1

          version_file.write_text(json.dumps({
              'version': version,
              'first_published': first_published,
              'first_published_iso': first_published_iso,
              'updates': updates,
              'updated': updated,
              'updated_iso': iso,
              'timezone': 'Asia/Tbilisi'
          }, indent=2) + '\n', encoding='utf-8')

          marker = (
              f'<p class="platform-version" data-platform-version>'
              f'First published {first_published} · {updates} updates · '
              f'Last updated {updated} · Version {version}</p>'
          )

          pattern = re.compile(
              r'<p\b[^>]*\bclass\s*=\s*["\'][^"\']*\bplatform-version\b[^"\']*["\'][^>]*>.*?</p>',
              flags=re.I | re.S
          )
          verification_file = 'google3023721c92b6366f.html'

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or p.name == verification_file:
                  continue
              s = p.read_text(encoding='utf-8')
              if pattern.search(s):
                  s2 = pattern.sub(marker, s, count=1)
              elif re.search(r'</footer>', s, flags=re.I):
                  s2 = re.sub(r'</footer>', f'  {marker}\n</footer>', s, count=1, flags=re.I)
              elif re.search(r'</body>', s, flags=re.I):
                  s2 = re.sub(r'</body>', f'<footer class="site-footer">\n  {marker}\n</footer>\n</body>', s, count=1, flags=re.I)
              else:
                  s2 = s
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit live status
        shell: bash
        run: |
          git config user.name "BHOC Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          VERSION="$(TZ=Asia/Tbilisi date +'%y.%m.%d')"
          git commit -m "Update live platform status to ${VERSION} [version-stamp]"
          git push
