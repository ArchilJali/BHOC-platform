name: Migrate Concepts & Hypotheses

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_concepts_hypotheses.cjs'
      - '.github/workflows/migrate-concepts-hypotheses.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate Concepts & Hypotheses content and SEO
        run: |
          git pull --rebase origin main
          node scripts/migrate_concepts_hypotheses.cjs
          node scripts/sync_navigation.cjs
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "Concepts & Hypotheses already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate to Concepts & Hypotheses [version-stamp]"
          git pull --rebase origin main
          git push
