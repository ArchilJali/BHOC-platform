name: Correct Levien 2006 source metadata
on:
  push:
    branches: ['preview/levien-2006-metadata-20260929']
    paths: ['.github/workflows/correct-levien-2006.yml']
permissions:
  contents: write
jobs:
  correct-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: preview/levien-2006-metadata-20260929
      - name: Correct only the two existing records
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy, json
          doi = '10.1111/j.1751-2824.2006.00025.x'
          source = 'https://doi.org/' + doi
          for name in ['human/BHOC-Human-publications.json','veterinary/Vet-publications.json']:
              p=Path(name); text=p.read_text(); before=json.loads(text)
              selected=[r for r in before if 'south africa' in r.get('title','').lower() and 'clinical experience' in r.get('title','').lower()]
              assert len(selected)==1
              row=copy.deepcopy(selected[0])
              print('BEFORE',name,json.dumps(row,ensure_ascii=False))
              row.update(title='South Africa: clinical experience with Hemopure',authors='Levien LJ',journal='ISBT Science Series',doi=doi)
              if isinstance(row['id'],int):
                  assert row['id']==369
                  row.update(doiUrl=source,citation='Levien LJ. South Africa: clinical experience with Hemopure. ISBT Science Series. 2006;1(1):167–173. doi: '+doi+'.',verification='Publisher metadata and abstract checked (2026-09-29)',note='Historical clinical surveillance report of 336 patients. Observational evidence, not a randomized comparison or clinical validation of BHOC. First published online 15 August 2006.')
              else:
                  assert row['id']=='bhoc-118'
                  row.update(doi_url=source,link=source,metadata_checked='2026-09-29')
              dec=json.JSONDecoder(); offset=1; found=False
              while offset<len(text):
                  while offset<len(text) and (text[offset].isspace() or text[offset]==','): offset+=1
                  if text[offset:offset+1]==']': break
                  value,end=dec.raw_decode(text,offset)
                  if value.get('id')==row['id']:
                      text=text[:offset]+json.dumps(row,ensure_ascii=False,indent=2).replace('\n','\n  ')+text[end:]
                      found=True; break
                  offset=end
              assert found
              after=json.loads(text)
              assert len(before)==len(after)
              assert [r for r in before if r.get('id')!=row['id']]==[r for r in after if r.get('id')!=row['id']]
              p.write_text(text)
              print('AFTER',name,json.dumps(row,ensure_ascii=False),'COUNT_UNCHANGED',len(after))
          PY
          git diff --check
      - name: Save metadata-only preview
        run: |
          rm .github/workflows/correct-levien-2006.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human/BHOC-Human-publications.json veterinary/Vet-publications.json .github/workflows/correct-levien-2006.yml
          git commit -m 'Correct Levien 2006 author, journal and DOI in existing evidence records'
          git push origin HEAD:preview/levien-2006-metadata-20260929
