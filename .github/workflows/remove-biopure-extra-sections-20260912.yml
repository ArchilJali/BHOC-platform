name: Remove Biopure extra sections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_biopure_extra_sections_20260912.cjs'
      - '.github/workflows/remove-biopure-extra-sections-20260912.yml'

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Remove extra sections
        run: node scripts/remove_biopure_extra_sections_20260912.cjs
      - name: Commit article cleanup
        shell: bash
        run: |
          git config user.name "BHOC Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add historical-sources/biopure-standing-on-the-shoulders-of-giants/article.md historical-sources/biopure-standing-on-the-shoulders-of-giants/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove extra Biopure quality and governance sections"
          git pull --rebase origin main
          git push
