name: Sync Open Discussion contextual links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_open_discussion_ctas.cjs'
      - '.github/workflows/sync-open-discussion-ctas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  sync-open-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Open Discussion contextual navigation
        run: |
          git pull --rebase origin main
          node scripts/sync_open_discussion_ctas.cjs

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "Open Discussion contextual navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html open-discussion/index.html
          git commit -m "Sync Open Discussion contextual links [version-stamp]"
          git pull --rebase origin main
          git push
