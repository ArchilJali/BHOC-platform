name: Sync shared navigation

on:
  push:
    branches: [main]
    paths:
      - 'config/navigation.json'
      - 'scripts/sync_navigation.cjs'
      - 'assets/intelligence-2026.css'
      - 'assets/navigation.js'
      - '.github/workflows/sync-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-navigation-sync
  cancel-in-progress: false

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync navigation across HTML pages
        run: |
          git pull --rebase origin main
          node scripts/sync_navigation.cjs

      - name: Commit generated navigation updates
        run: |
          if git diff --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Sync shared BHOC navigation [version-stamp]"
          git pull --rebase origin main
          git push
