name: Sync SEO metadata and sitemap

on:
  push:
    branches:
      - main
      - 'preview/evidence-custom-domain-20260912'
    paths:
      - 'seo/page-metadata.json'
      - 'scripts/apply_seo_metadata.cjs'
      - 'version.json'
      - '.github/workflows/seo-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply canonical SEO metadata
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          node scripts/apply_seo_metadata.cjs

      - name: Commit generated SEO outputs
        run: |
          git config user.name "BHOC SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "SEO metadata and sitemap already synchronized."
            exit 0
          fi
          git commit -m "Sync BHOC SEO metadata and sitemap [version-stamp]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
