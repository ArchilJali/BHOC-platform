name: Sync SEO metadata and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'seo/page-metadata.json'
      - 'scripts/apply_seo_metadata.cjs'
      - 'version.json'
      - '.github/workflows/seo-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  sync-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Apply canonical SEO metadata
        run: |
          git pull --rebase origin main
          node scripts/apply_seo_metadata.cjs

      - name: Commit generated SEO outputs
        run: |
          git config user.name "BHOC SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "SEO metadata and sitemap already synchronized."
            exit 0
          fi
          git commit -m "Sync BHOC SEO metadata and sitemap [version-stamp]"
          git pull --rebase origin main
          git push
