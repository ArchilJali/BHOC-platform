name: Fix prehospital discussion contrast

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_prehospital_discussion_contrast.cjs'
      - '.github/workflows/fix-prehospital-discussion-contrast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-platform-content-write
  cancel-in-progress: false

jobs:
  fix-contrast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contrast fix
        run: |
          git pull --rebase origin main
          node scripts/fix_prehospital_discussion_contrast.cjs
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "Contrast already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-discussion/prehospital-oxygen-delivery-selection.html
          git commit -m "Fix Open Discussion text contrast [version-stamp]"
          git pull --rebase origin main
          git push
