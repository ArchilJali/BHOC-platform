name: Patch live text-only social preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_live_text_only_social.py'
      - '.github/workflows/patch-live-text-social.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch generator and tests
        run: python scripts/patch_live_text_only_social.py
      - name: Regenerate managed SEO metadata
        run: node scripts/apply_seo_metadata.cjs
      - name: Validate SEO tests
        run: node --test tests/seo.test.cjs
      - name: Commit live text-only social metadata
        run: |
          git config user.name "BHOC Social Metadata"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/apply_seo_metadata.cjs tests/seo.test.cjs index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use text-only Evidence social preview"
          git pull --rebase --autostash origin main
          git push origin main
