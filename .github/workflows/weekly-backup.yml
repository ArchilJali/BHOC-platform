name: Weekly protected backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-backup.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build full repository backup
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          OUT="$RUNNER_TEMP/bhoc-backup"
          mkdir -p "$OUT"
          git bundle create "$OUT/BHOC-platform_v${VERSION}_FULL.bundle" --all
          git archive --format=tar.gz --output="$OUT/BHOC-platform_v${VERSION}_SITE.tar.gz" HEAD
          sha256sum "$OUT/BHOC-platform_v${VERSION}_FULL.bundle" "$OUT/BHOC-platform_v${VERSION}_SITE.tar.gz" > "$OUT/BHOC-platform_v${VERSION}_SHA256.txt"
      - name: Store backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: BHOC-platform_BACKUP_v${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/bhoc-backup/
          retention-days: 90
          if-no-files-found: error
