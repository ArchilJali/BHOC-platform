name: Verified weekly full backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-backup.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-full-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # Complete history is already fetched above. Do not run git fetch origin here: credentials are intentionally not persisted.

      - name: Build and test full backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          git update-ref refs/heads/main "$GITHUB_SHA"
          repo_name="${GITHUB_REPOSITORY#*/}"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="$RUNNER_TEMP/verified-full-backup"
          work="$RUNNER_TEMP/verified-full-backup-work"
          mkdir -p "$out" "$work"
          bundle_name="${repo_name}-${stamp}.git.bundle"
          snapshot_name="${repo_name}-HEAD-${GITHUB_SHA}.tar.gz"
          bundle="$work/$bundle_name"
          snapshot="$work/$snapshot_name"
          package="$out/${repo_name}-full-backup-${stamp}.tar.gz"
          git bundle create "$bundle" --all
          git archive --format=tar.gz --prefix="${repo_name}-${GITHUB_SHA}/" --output="$snapshot" "$GITHUB_SHA"
          git for-each-ref --sort=refname --format='%(objectname)%09%(refname)' refs/heads refs/remotes refs/tags > "$work/REFS.tsv"
          git bundle verify "$bundle" > "$work/BUNDLE-VERIFY.txt" 2>&1
          restore="$RUNNER_TEMP/verified-full-backup-restore.git"
          restored_refs="$RUNNER_TEMP/verified-full-backup-restored-refs.tsv"
          git init --bare --quiet "$restore"
          git -C "$restore" fetch --quiet "$bundle" 'refs/*:refs/*'
          git -C "$restore" fsck --full --strict > "$work/RESTORE-FSCK.txt" 2>&1
          test "$(git -C "$restore" rev-parse refs/heads/main)" = "$GITHUB_SHA"
          git -C "$restore" for-each-ref --sort=refname --format='%(objectname)%09%(refname)' refs/heads refs/remotes refs/tags > "$restored_refs"
          cmp "$work/REFS.tsv" "$restored_refs"
          printf 'repository=%s\ncreated_at_utc=%s\nhead_sha=%s\nretention_rule=keep at least 3 verified full backups; delete only after 21 days when 3 newer verified backups exist\n' "$GITHUB_REPOSITORY" "$stamp" "$GITHUB_SHA" > "$work/MANIFEST.txt"
          (cd "$work" && sha256sum "$bundle_name" "$snapshot_name" REFS.tsv BUNDLE-VERIFY.txt RESTORE-FSCK.txt MANIFEST.txt > SHA256SUMS)
          tar -C "$work" -czf "$package" "$bundle_name" "$snapshot_name" REFS.tsv BUNDLE-VERIFY.txt RESTORE-FSCK.txt MANIFEST.txt SHA256SUMS
          tar -tzf "$package" > /dev/null
          sha256sum "$package" > "$package.sha256"
          echo "artifact_name=${repo_name}-verified-full-backup-${stamp}" >> "$GITHUB_OUTPUT"
          echo "backup_path=$out" >> "$GITHUB_OUTPUT"

      - name: Store verified backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: ${{ steps.backup.outputs.backup_path }}/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
