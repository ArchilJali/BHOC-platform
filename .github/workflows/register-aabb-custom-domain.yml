name: Register AABB metadata for custom Evidence domain
on:
  push:
    branches: ['preview/evidence-custom-domain-20260912']
    paths:
      - 'scripts/register_aabb_metadata_custom_domain.py'
      - '.github/workflows/register-aabb-custom-domain.yml'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/register_aabb_metadata_custom_domain.py
      - run: node scripts/apply_seo_metadata.cjs
      - run: node --test tests/seo.test.cjs
      - name: Commit custom-domain AABB metadata
        run: |
          git config user.name "BHOC SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add seo/page-metadata.json sitemap.xml science/aabb-rbc-transfusion-thresholds-oxygen-delivery.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register AABB page for custom Evidence domain"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
